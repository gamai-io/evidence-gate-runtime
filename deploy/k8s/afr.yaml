apiVersion: v1
kind: Namespace
metadata:
  name: afr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: afr-api
  namespace: afr
data:
  api.py: |
    import json, os, re, http.server
    TRACE = "/data/traces.jsonl"
    ACTION = re.compile(r"\b(created|made|sent|deleted|wrote|napravljen|poslan|obrisan)\b", re.I)
    DONE = re.compile(r"\b(done|gotovo|urađeno|završeno)\b", re.I)
    def verdict(rec):
        txt = (rec.get("claim") or "") + " " + (rec.get("stdout_tail") or "")
        ev = [e for e in (rec.get("evidence") or []) if e.get("ok", True)]
        if ACTION.search(txt):
            return "PASS" if ev else "FALSE_SUCCESS"
        if DONE.search(txt) and not ev:
            return "FALSE_SUCCESS"
        return "PASS"
    class H(http.server.BaseHTTPRequestHandler):
        def _j(self, obj, code=200):
            b = json.dumps(obj).encode(); self.send_response(code)
            self.send_header("Content-Type", "application/json"); self.send_header("Content-Length", str(len(b)))
            self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            if self.path == "/health": return self._j({"ok": True})
            return self._j({"err": "not found"}, 404)
        def do_POST(self):
            n = int(self.headers.get("Content-Length", 0)); body = self.rfile.read(n)
            try: rec = json.loads(body or b"{}")
            except Exception: return self._j({"err": "bad json"}, 400)
            if self.path == "/record":
                os.makedirs("/data", exist_ok=True)
                with open(TRACE, "a") as f: f.write(json.dumps(rec) + "\n")
                return self._j({"ok": True, "verdict": verdict(rec)})
            if self.path == "/verify":
                return self._j({"ok": True, "verdict": verdict(rec)})
            return self._j({"err": "not found"}, 404)
        def log_message(self, *a): pass
    http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: afr-traces
  namespace: afr
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: afr-api
  namespace: afr
spec:
  replicas: 1
  selector:
    matchLabels: {app: afr-api}
  template:
    metadata:
      labels: {app: afr-api}
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["python", "/app/api.py"]
          ports: [{containerPort: 8080}]
          volumeMounts:
            - {name: src, mountPath: /app}
            - {name: traces, mountPath: /data}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 3
      volumes:
        - name: src
          configMap: {name: afr-api}
        - name: traces
          persistentVolumeClaim: {claimName: afr-traces}
---
apiVersion: v1
kind: Service
metadata:
  name: afr-api
  namespace: afr
spec:
  type: NodePort
  selector: {app: afr-api}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31888
